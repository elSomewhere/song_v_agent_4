################################
# Enhanced context windows for long storyboards
ctx_images:      6
ctx_window:      4
# NEW: Global context parameters
global_context_enabled: true
global_ctx_window:      20        # Look back across more scenes
global_ctx_weight:      0.3       # Weight for global vs local context
character_consistency_window: 50  # Track character appearances
environment_consistency_window: 30 # Track environment continuity
token_cap:       4000          # GPT call cap

# API Response Token Limits
api_max_tokens:
  planner: 1000
  reviewer: 1500
  variation_mgr: 1500
  vision_qa: 1000
  fast_qa: 10
  memory_rerank: 120
  static_summary: 500

# NEW: Advanced context modes
context_mode: "enhanced"  # basic | enhanced | global
consistency_tracking:
  characters: true
  environments: true
  style_elements: true
  narrative_flow: true

################################
# variations
n_variations:          3
variation_camera:      full     # full | angle_only | composition_only

# scene structure
shots_per_scene:       1        # Number of shots to generate per scene

################################
# Image generation settings
aspect_ratio:          square   # square | landscape | portrait | auto
image_quality:         medium   # low | medium | high | auto

################################
# retries
max_retries:      2
max_edit_retries: 1

################################
# AI pre-processing
preprocess:
  script:       auto
  refs:         auto
  max_tokens_script: 1000
  max_tokens_refs:   2000
  tag_confidence_threshold: 0.50

################################
# budget
budget_usd: 50

# render engine
render_engine: openai  # openai | midjourney

################################
# model map (explicit — do NOT swap)
models:
  embedding_text:  text-embedding-3-large
  planner:         gpt-4o
  reviewer:        gpt-4o
  variation_mgr:   gpt-4o
  renderer_new:    gpt-image-1          # never "dall-e-3"
  renderer_edit:   gpt-image-1
  fast_qa:         gpt-4o
  vision_qa:       gpt-4o
  ref_tagger:      gpt-4o
  script_parser:   gpt-4o
  entities_parser: gpt-4o
  reranker_text:   gpt-4o-mini 